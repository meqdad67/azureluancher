name: Release azure update
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply update
        run: |
          unzip -o azure-update-19.zip
          rm -f azure-update-*.zip
          npm version 1.1.7 --no-git-tag-version --allow-same-version
      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "v1.1.7 azure client + new ui + performance + anti-freeze" || echo "nothing to commit"
          git pull --rebase
          git push
          git tag -f v1.1.7
          git push -f origin v1.1.7
      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref v1.1.7
