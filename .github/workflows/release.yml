name: Release azure update
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.1.8). Leave empty to auto-pick the next one'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply update zip and pick version
        id: apply
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          ZIPS=(*.zip)
          if [ ${#ZIPS[@]} -gt 0 ]; then
            for z in "${ZIPS[@]}"; do
              echo "applying $z"
              unzip -o "$z"
              rm -f "$z"
            done
          else
            echo "no zip found, releasing the current files as they are"
          fi
          if [ -n "$INPUT_VERSION" ]; then
            NEW="${INPUT_VERSION#v}"
            if ! echo "$NEW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "invalid version: $NEW"; exit 1
            fi
          else
            NEW=$(node -e "
              const { execSync } = require('child_process');
              const cmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
              let top = require('./package.json').version;
              for (const t of execSync('git tag').toString().split('\n').map((s) => s.trim().replace(/^v/, ''))) if (/^\d+\.\d+\.\d+$/.test(t) && cmp(t, top) > 0) top = t;
              const [a, b, c] = top.split('.').map(Number);
              console.log([a, b, c + 1].join('.'));
            ")
          fi
          npm version "$NEW" --no-git-tag-version --allow-same-version
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.apply.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "v${VERSION} azure update" || echo "nothing to commit"
          git pull --rebase
          git push origin HEAD
          git tag -f "v${VERSION}"
          git push -f origin "v${VERSION}"
      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apply.outputs.version }}
        run: gh workflow run build.yml --ref "v${VERSION}"
