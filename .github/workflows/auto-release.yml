name: Auto release from update zip
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply update zip and pick the next version
        id: apply
        run: |
          shopt -s nullglob
          ZIPS=(*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "no update zip, nothing to do"
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for z in "${ZIPS[@]}"; do
            echo "applying $z"
            unzip -o "$z"
            rm -f "$z"
          done
          NEW=$(node -e "
            const { execSync } = require('child_process');
            const cmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
            let top = require('./package.json').version;
            for (const t of execSync('git tag').toString().split('\n').map((s) => s.trim().replace(/^v/, ''))) if (/^\d+\.\d+\.\d+$/.test(t) && cmp(t, top) > 0) top = t;
            const [a, b, c] = top.split('.').map(Number);
            console.log([a, b, c + 1].join('.'));
          ")
          npm version "$NEW" --no-git-tag-version --allow-same-version
          echo "go=yes" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        if: steps.apply.outputs.go == 'yes'
        env:
          VERSION: ${{ steps.apply.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "v${VERSION} auto update" || echo "nothing to commit"
          git pull --rebase
          git push origin HEAD
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
      - name: Trigger build
        if: steps.apply.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apply.outputs.version }}
        run: gh workflow run build.yml --ref "v${VERSION}"
